name: Verify artifact reader metadata only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    if: github.repository == 'TheGreenCedar/AppleRelease' && github.ref == 'refs/heads/main' && github.actor == 'TheGreenCedar'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test tests/app-installation.test.mjs
      - name: Verify App public permissions and full selected installation
        env:
          APP_ID: ${{ vars.ARTIFACT_READER_APP_ID }}
          APP_KEY: ${{ secrets.ARTIFACT_READER_PRIVATE_KEY }}
        run: node scripts/verify_app_installation.mjs
